<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - MF Production</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/improved-cards.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta Pixel Code -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #C6A664;
            --dark: #1a1a1a;
            --text: #4a4a4a;
            --bg: #fafafa;
            --white: #ffffff;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }
        
        /* Breadcrumb */
        .breadcrumb { background: var(--white); padding: 20px 0; border-bottom: 1px solid #f0f0f0; }
        .breadcrumb-nav { display: flex; gap: 10px; font-size: 13px; color: #999; align-items: center; }
        .breadcrumb-nav a { color: var(--gold); text-decoration: none; transition: opacity 0.3s; }
        .breadcrumb-nav a:hover { opacity: 0.7; }
        .breadcrumb-nav i { font-size: 10px; }
        #breadcrumbProduct { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Product Layout */
        .product-detail { background: var(--white); }
        .product-detail-container { display: grid; grid-template-columns: 55% 45%; gap: 80px; padding: 60px 0; max-width: 1400px; margin: 0 auto; padding-left: 40px; padding-right: 40px; }
        
        /* Gallery */
        .product-gallery { position: sticky; top: 100px; height: fit-content; max-height: calc(100vh - 120px); }
        .main-image { width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; margin-bottom: 20px; background: #f9f9f9; box-shadow: 0 10px 40px rgba(0,0,0,0.08); position: relative; }
        .main-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .main-image:hover img { transform: scale(1.08); }
        .image-badge { position: absolute; top: 20px; right: 20px; background: rgba(26,26,26,0.9); color: white; padding: 8px 16px; border-radius: 25px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; backdrop-filter: blur(10px); }
        .thumbnail-gallery { display: flex; gap: 15px; overflow-x: auto; padding: 5px 0; }
        .thumbnail-gallery::-webkit-scrollbar { height: 4px; }
        .thumbnail-gallery::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        .thumbnail { width: 90px; height: 90px; border-radius: 12px; overflow: hidden; cursor: pointer; border: 3px solid transparent; flex-shrink: 0; transition: all 0.3s; position: relative; }
        .thumbnail::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background 0.3s; }
        .thumbnail:hover::after { background: rgba(198,166,100,0.1); }
        .thumbnail:hover { border-color: rgba(198,166,100,0.3); transform: translateY(-2px); }
        .thumbnail.active { border-color: var(--gold); box-shadow: 0 4px 15px rgba(198,166,100,0.3); }
        .thumbnail.active::after { background: rgba(198,166,100,0.05); }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Product Info */
        .product-info { padding: 20px 0; }
        .product-category { display: inline-block; background: transparent; color: var(--gold); padding: 0; font-size: 11px; font-weight: 600; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .product-title { font-size: 42px; font-weight: 700; margin-bottom: 20px; line-height: 1.2; color: var(--dark); letter-spacing: -0.5px; }
        .product-rating { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid #f0f0f0; }
        .stars { color: var(--gold); font-size: 14px; letter-spacing: 2px; }
        .rating-text { font-weight: 600; font-size: 15px; color: var(--dark); }
        .review-count { color: #999; font-size: 14px; }
        .trust-badges { display: flex; gap: 25px; margin-top: 15px; flex-wrap: wrap; }
        .trust-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
        .trust-badge i { color: var(--gold); font-size: 16px; }
        
        /* Price */
        .product-price { margin-bottom: 35px; }
        .price-container { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .current-price { font-size: 38px; font-weight: 700; color: var(--gold); letter-spacing: -1px; }
        .original-price { font-size: 22px; color: #ccc; text-decoration: line-through; position: relative; }
        .original-price::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #ccc; }
        .discount-badge { background: linear-gradient(135deg, var(--gold), #D4AF37); color: white; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 2px 10px rgba(198,166,100,0.3); }
        .price-note { font-size: 12px; color: #999; margin-top: 10px; font-style: italic; }
        
        /* Quantity */
        .quantity-section { margin-bottom: 20px; background: rgba(198,166,100,0.03); padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(198,166,100,0.1); }
        .quantity-label { font-weight: 500; margin-bottom: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--dark); }
        .quantity-controls { display: flex; align-items: center; gap: 12px; }
        .quantity-input { display: flex; align-items: center; border: 1px solid #e0e0e0; border-radius: 50px; overflow: hidden; background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .qty-btn { width: 30px; height: 30px; border: none; background: transparent; cursor: pointer; font-size: 14px; font-weight: 300; color: var(--dark); transition: all 0.3s; }
        .qty-btn:hover { background: var(--gold); color: white; }
        .qty-value { width: 40px; height: 30px; border: none; text-align: center; font-size: 13px; font-weight: 500; background: transparent; }
        .stock-info { color: #6b9b6e; font-weight: 500; font-size: 10px; display: flex; align-items: center; gap: 4px; background: rgba(107,155,110,0.1); padding: 5px 10px; border-radius: 20px; }
        .stock-info i { font-size: 9px; }
        
        /* Related Products */
        .related-products { background: var(--bg); padding: 80px 0; }
        .related-title { font-size: 32px; font-weight: 300; text-align: center; color: var(--dark); letter-spacing: -0.5px; }
        .related-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
        
        /* Tablet */
        @media (max-width: 1200px) {
            .container { padding: 0 30px; }
            .product-detail-container { grid-template-columns: 50% 50%; gap: 50px; padding: 50px 30px; }
            .product-title { font-size: 36px; }
            .current-price { font-size: 34px; }
            .related-grid { grid-template-columns: repeat(3, 1fr); gap: 25px; }
            #descriptionSections > div { grid-template-columns: 1fr 1fr !important; gap: 35px !important; padding: 35px !important; }
        }
        
        @media (max-width: 1024px) {
            .product-detail-container { grid-template-columns: 1fr; gap: 40px; padding: 40px 30px; }
            .product-gallery { position: static; }
            .main-image { border-radius: 18px; }
            .product-title { font-size: 32px; }
            .current-price { font-size: 32px; }
            .related-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .related-products { padding: 60px 0; }
            .related-title { font-size: 28px; }
            #descriptionSections > div { grid-template-columns: 1fr !important; gap: 25px !important; padding: 30px !important; }
        }
        
        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .breadcrumb { padding: 15px 0; }
            .breadcrumb-nav { font-size: 11px; gap: 6px; }
            .breadcrumb-nav i { font-size: 8px; }
            #breadcrumbProduct { max-width: 100px; }
            .product-detail-container { padding: 25px 20px; gap: 30px; }
            .main-image { aspect-ratio: 4/5; border-radius: 15px; margin-bottom: 15px; }
            .thumbnail { width: 70px; height: 70px; border-radius: 10px; border-width: 2px; }
            .thumbnail-gallery { gap: 10px; }
            .product-info { padding: 10px 0; }
            .product-category { font-size: 10px; letter-spacing: 1.5px; margin-bottom: 12px; }
            .product-title { font-size: 24px; margin-bottom: 15px; letter-spacing: -0.3px; }
            .product-rating { gap: 8px; margin-bottom: 20px; padding-bottom: 20px; }
            .stars { font-size: 12px; letter-spacing: 1px; }
            .rating-text { font-size: 13px; }
            .review-count { font-size: 12px; }
            .product-price { margin-bottom: 25px; }
            .price-container { gap: 12px; flex-wrap: wrap; }
            .current-price { font-size: 28px; }
            .original-price { font-size: 18px; }
            .discount-badge { font-size: 10px; padding: 4px 10px; }
            .quantity-section { margin-bottom: 25px; }
            .quantity-label { font-size: 12px; margin-bottom: 12px; }
            .quantity-controls { gap: 15px; flex-wrap: wrap; }
            .qty-btn { width: 40px; height: 40px; font-size: 16px; }
            .qty-value { width: 50px; height: 40px; font-size: 14px; }
            .stock-info { font-size: 12px; }
            .action-secondary { padding: 20px 0 !important; margin-bottom: 30px !important; }
            .action-secondary button { font-size: 12px !important; }
            .action-secondary .btn-text { display: none; }
            .action-secondary i { font-size: 20px !important; }
            .desc-images { grid-template-columns: 1fr !important; gap: 12px !important; margin-bottom: 30px !important; }
            .product-meta { grid-template-columns: 1fr !important; gap: 15px !important; padding: 20px 0 !important; }
            #descriptionSections > div { grid-template-columns: 1fr !important; gap: 20px !important; padding: 25px 20px !important; margin-bottom: 30px !important; }
            #descriptionSections img { aspect-ratio: 16/9 !important; }
            #descriptionSections > div > div:first-child { order: 1; }
            #descriptionSections > div > div:last-child { order: 2; }
            .desc-sections-container { margin-top: 40px !important; }
            .reviews-section { margin-top: 60px !important; margin-bottom: 60px !important; }
            .reviews-section h3 { font-size: 24px !important; margin-bottom: 40px !important; }
            .review-form-container { padding: 25px !important; border-radius: 15px !important; margin-bottom: 40px !important; }
            .review-form-container h4 { font-size: 16px !important; margin-bottom: 20px !important; }
            .star-rating { font-size: 28px !important; }
            #reviewsContainer { gap: 20px !important; }
            .related-grid { grid-template-columns: 1fr; gap: 20px; }
            .related-products { padding: 50px 0; }
            .related-title { font-size: 24px; }
            .trust-badges { gap: 15px; }
            .trust-badge { font-size: 11px; }
            .trust-badge i { font-size: 14px; }
        }
        
        @media (max-width: 480px) {
            .container { padding: 0 15px; }
            .product-detail-container { padding: 20px 15px; }
            .product-title { font-size: 20px; }
            .current-price { font-size: 24px; }
            .original-price { font-size: 16px; }
            .thumbnail { width: 60px; height: 60px; }
            .action-secondary { justify-content: space-around; }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <!-- Breadcrumb -->
    <section class="breadcrumb">
        <div class="container">
            <nav class="breadcrumb-nav">
                <a href="index.html">Home</a>
                <i class="fas fa-chevron-right"></i>
                <a href="products.html">Products</a>
                <i class="fas fa-chevron-right"></i>
                <span id="breadcrumbCategory">Category</span>
                <i class="fas fa-chevron-right"></i>
                <span id="breadcrumbProduct">Product</span>
            </nav>
        </div>
    </section>

    <!-- Product Detail -->
    <section class="product-detail">
        <div class="product-detail-container">
            <!-- Product Gallery -->
            <div class="product-gallery">
                <div class="main-image">
                    <img id="productImage" src="" alt="Product Image">
                    <div class="image-badges" id="productBadges"></div>
                </div>
                <div class="thumbnail-gallery" id="thumbnailGallery"></div>
            </div>
            
            <!-- Product Info -->
            <div class="product-info">
                <div class="product-category" id="productCategory"></div>
                <h1 class="product-title" id="productTitle">Loading...</h1>
                
                <div class="product-rating">
                    <div class="stars" id="productStars"></div>
                    <span class="rating-text" id="productRating">0</span>
                    <span class="review-count">(<span id="productReviews">0</span> reviews)</span>
                </div>
                
                <div class="product-price">
                    <div class="price-container">
                        <span class="current-price" id="productPrice">Rs. 0</span>
                        <span class="original-price" id="productOriginalPrice" style="display: none;"></span>
                        <span class="discount-badge" id="discountBadge" style="display: none;"></span>
                    </div>
                </div>
                
                <div class="quantity-section">
                    <div class="quantity-label">Quantity:</div>
                    <div class="quantity-controls">
                        <div class="quantity-input">
                            <button class="qty-btn" onclick="changeQuantity(-1)">-</button>
                            <input type="number" class="qty-value" id="quantity" value="1" min="1" readonly>
                            <button class="qty-btn" onclick="changeQuantity(1)">+</button>
                        </div>
                        <div class="stock-info">
                            <i class="fas fa-check-circle"></i>
                            <span id="productStock">0</span> in stock
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
                    <button onclick="addToCart()" class="btn-add-cart" style="flex: 1; min-width: 200px; padding: 18px 40px; background: var(--dark); color: white; border: none; border-radius: 50px; font-size: 14px; font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: all 0.4s ease; position: relative; overflow: hidden;" onmouseover="this.style.background='var(--gold)'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 30px rgba(198,166,100,0.3)';" onmouseout="this.style.background='var(--dark)'; this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        <span style="position: relative; z-index: 1;">Add to Cart</span>
                    </button>
                    <button onclick="buyNow()" class="btn-buy-now" style="flex: 1; min-width: 200px; padding: 18px 40px; background: var(--gold); color: white; border: none; border-radius: 50px; font-size: 14px; font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: all 0.4s ease; position: relative; overflow: hidden;" onmouseover="this.style.background='#D4AF37'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 30px rgba(198,166,100,0.4)';" onmouseout="this.style.background='var(--gold)'; this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        <span style="position: relative; z-index: 1;">Buy Now</span>
                    </button>
                </div>
                
                <div class="trust-badges">
                    <div class="trust-badge"><i class="fas fa-shield-alt"></i> Secure Payment</div>
                    <div class="trust-badge"><i class="fas fa-truck"></i> Free Shipping</div>
                    <div class="trust-badge"><i class="fas fa-undo"></i> Easy Returns</div>
                </div>
                
                <div class="action-secondary" style="display: flex; gap: 25px; padding: 25px 0; border-top: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; margin-bottom: 40px;">
                    <button onclick="addToWishlist()" style="background: none; border: none; color: var(--text); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;" onmouseover="this.style.color='var(--gold)'; this.querySelector('i').style.transform='scale(1.2)';" onmouseout="this.style.color='var(--text)'; this.querySelector('i').style.transform='scale(1)';">
                        <i class="far fa-heart" style="font-size: 18px; transition: transform 0.3s;"></i> <span class="btn-text">Wishlist</span>
                    </button>
                    <button onclick="shareProduct()" style="background: none; border: none; color: var(--text); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;" onmouseover="this.style.color='var(--gold)'; this.querySelector('i').style.transform='scale(1.2)';" onmouseout="this.style.color='var(--text)'; this.querySelector('i').style.transform='scale(1)';">
                        <i class="fas fa-share-alt" style="font-size: 18px; transition: transform 0.3s;"></i> <span class="btn-text">Share</span>
                    </button>
                </div>
                
                <!-- Product Description -->
                <div style="margin-bottom: 40px;">
                    <h3 style="font-size: 13px; font-weight: 500; color: var(--dark); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 10px;"><span style="width: 30px; height: 1px; background: var(--gold);"></span> Description</h3>
                    <div id="productDescription" style="font-size: 15px; line-height: 1.9; color: var(--text); font-weight: 300; white-space: pre-line;">Loading product details...</div>
                </div>
                
                <!-- Product Meta -->
                <div class="product-meta" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 30px 0; border-top: 1px solid #f0f0f0;">
                    <div style="background: rgba(198,166,100,0.03); padding: 20px; border-radius: 12px; border: 1px solid rgba(198,166,100,0.1);">
                        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #999; margin-bottom: 8px;">Category</div>
                        <div id="productMetaCategory" style="font-size: 14px; color: var(--dark); font-weight: 500;">-</div>
                    </div>
                    <div style="background: rgba(107,155,110,0.03); padding: 20px; border-radius: 12px; border: 1px solid rgba(107,155,110,0.1);">
                        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #999; margin-bottom: 8px;">Availability</div>
                        <div style="font-size: 14px; color: #6b9b6e; font-weight: 500;">In Stock</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Description Sections (Full Width) -->
        <div class="container desc-sections-container" style="margin-top: 250px; margin-bottom: 80px;">
            <div style="text-align: center; margin-bottom: 60px;">
                <h2 style="font-size: 32px; font-weight: 300; color: var(--dark); letter-spacing: -0.5px; margin-bottom: 10px;">Product Features</h2>
                <div style="width: 60px; height: 2px; background: var(--gold); margin: 0 auto;"></div>
            </div>
            <div id="descriptionSections"></div>
        </div>
        
        <!-- Reviews Section -->
        <div class="container reviews-section" style="margin-top: 100px; margin-bottom: 100px;">
            <div style="text-align: center; margin-bottom: 60px;">
                <h3 style="font-size: 32px; font-weight: 300; color: var(--dark); letter-spacing: -0.5px; margin-bottom: 10px;">Customer Reviews</h3>
                <div style="width: 60px; height: 2px; background: var(--gold); margin: 0 auto;"></div>
            </div>
            
            <!-- Write Review Form -->
            <div class="review-form-container" style="max-width: 700px; margin: 0 auto 60px; background: var(--white); padding: 40px; border-radius: 20px; border: 1px solid #f0f0f0; box-shadow: 0 5px 20px rgba(0,0,0,0.05);">
                <h4 style="margin-bottom: 30px; color: var(--dark); font-size: 18px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;">Write a Review</h4>
                <form id="reviewForm">
                    <input type="text" id="reviewerName" placeholder="Your Name" required style="width: 100%; padding: 15px 20px; border: 1px solid #e0e0e0; border-radius: 50px; font-size: 14px; margin-bottom: 20px; transition: all 0.3s; font-family: inherit;" onfocus="this.style.borderColor='var(--gold)'; this.style.boxShadow='0 0 0 3px rgba(198,166,100,0.1)';" onblur="this.style.borderColor='#e0e0e0'; this.style.boxShadow='none';">
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 12px; font-weight: 500; color: var(--dark); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Rating</label>
                        <div class="star-rating" style="font-size: 32px; color: #e0e0e0; cursor: pointer; display: flex; gap: 8px;">
                            <span data-rating="1" style="transition: all 0.2s;">★</span>
                            <span data-rating="2" style="transition: all 0.2s;">★</span>
                            <span data-rating="3" style="transition: all 0.2s;">★</span>
                            <span data-rating="4" style="transition: all 0.2s;">★</span>
                            <span data-rating="5" style="transition: all 0.2s;">★</span>
                        </div>
                    </div>
                    
                    <textarea id="reviewComment" placeholder="Share your thoughts..." required style="width: 100%; padding: 15px 20px; border: 1px solid #e0e0e0; border-radius: 20px; font-size: 14px; min-height: 120px; resize: vertical; transition: all 0.3s; font-family: inherit; margin-bottom: 25px;" onfocus="this.style.borderColor='var(--gold)'; this.style.boxShadow='0 0 0 3px rgba(198,166,100,0.1)';" onblur="this.style.borderColor='#e0e0e0'; this.style.boxShadow='none';"></textarea>
                    
                    <button type="submit" style="background: var(--dark); color: white; padding: 15px 40px; border: none; border-radius: 50px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1.5px; width: 100%;" onmouseover="this.style.background='var(--gold)'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 5px 15px rgba(198,166,100,0.3)';" onmouseout="this.style.background='var(--dark)'; this.style.transform='translateY(0)'; this.style.boxShadow='none';">Submit Review</button>
                </form>
            </div>
            
            <!-- Reviews Display -->
            <div id="reviewsContainer" style="max-width: 900px; margin: 0 auto; display: grid; gap: 25px;">
                <!-- Reviews loaded via JS -->
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section class="related-products">
        <div class="container">
            <div style="text-align: center; margin-bottom: 50px;">
                <h2 class="related-title" style="font-size: 32px; font-weight: 300; color: var(--dark); letter-spacing: -0.5px; margin-bottom: 10px;">You May Also Like</h2>
                <div style="width: 60px; height: 2px; background: var(--gold); margin: 0 auto;"></div>
            </div>
            <div class="related-grid" id="relatedProducts"></div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    
    <script>
        let currentProduct = null;
        let quantity = 1;

        async function loadProduct() {
            return new Promise(async (resolve, reject) => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
                if (!productId) {
                    window.location.href = 'products.html';
                    reject('No product ID');
                    return;
                }

                try {
                    const response = await fetch(`/api/products/${productId}`);
                    if (response.ok) {
                        currentProduct = await response.json();
                        displayProduct(currentProduct);
                        loadRelatedProducts();
                        resolve(currentProduct);
                    } else {
                        throw new Error('Product not found');
                    }
                } catch (error) {
                    console.error('Error loading product:', error);
                    document.querySelector('.product-detail-container').innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff6b35; margin-bottom: 20px;"></i>
                            <h2>Product Not Found</h2>
                            <p>The product you're looking for doesn't exist or has been removed.</p>
                            <button class="btn btn-primary" onclick="window.location.href='products.html'" style="padding: 15px 30px; background: #C6A664; color: white; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer;">
                                <i class="fas fa-arrow-left"></i> Back to Products
                            </button>
                        </div>
                    `;
                    reject(error);
                }
            });
        }

        function displayProduct(product) {
            // Update breadcrumb
            document.getElementById('breadcrumbCategory').textContent = getCategoryName(product.category);
            document.getElementById('breadcrumbProduct').textContent = product.name;
            
            // Product images
            document.getElementById('productImage').src = product.image;
            document.getElementById('productImage').alt = product.name;
            
            // Setup image gallery
            setupImageGallery(product);
            
            // Product badges
            const badgesContainer = document.getElementById('productBadges');
            if (product.new) {
                badgesContainer.innerHTML = '<div class="image-badge">New Arrival</div>';
            } else if (product.bestseller) {
                badgesContainer.innerHTML = '<div class="image-badge">Bestseller</div>';
            }
            
            // Product info
            document.getElementById('productCategory').textContent = getCategoryName(product.category);
            document.getElementById('productMetaCategory').textContent = getCategoryName(product.category);
            document.getElementById('productTitle').textContent = product.name;
                            document.getElementById('productStars').innerHTML = '★★★★★';
                            document.getElementById('productRating').textContent = '5.0';
            document.getElementById('productReviews').textContent = product.reviews || 0;
            document.getElementById('productPrice').textContent = `AED ${product.price.toLocaleString()}`;
            
            if (product.originalPrice && product.originalPrice > product.price) {
                document.getElementById('productOriginalPrice').textContent = `AED ${product.originalPrice.toLocaleString()}`;
                document.getElementById('productOriginalPrice').style.display = 'inline';
                
                const discount = Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100);
                if (discount > 0) {
                    document.getElementById('discountBadge').textContent = `${discount}% OFF`;
                    document.getElementById('discountBadge').style.display = 'inline-block';
                }
            }
            
            document.getElementById('productDescription').innerHTML = product.description;
            document.getElementById('productStock').textContent = product.stock || 10;
            
            // Display description sections with alternating layout
            const descSectionsContainer = document.getElementById('descriptionSections');
            console.log('Product data:', product);
            console.log('Product descriptionSections:', product.descriptionSections);
            
            if (product.descriptionSections && product.descriptionSections.length > 0) {
                console.log('Rendering', product.descriptionSections.length, 'description sections');
                descSectionsContainer.innerHTML = product.descriptionSections.map((section, index) => {
                    const isLeft = index % 2 === 0;
                    console.log(`Section ${index + 1}:`, section);
                    return `
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; margin-bottom: 50px; background: linear-gradient(135deg, rgba(198,166,100,0.02), rgba(198,166,100,0.05)); padding: 40px; border-radius: 20px; border: 1px solid rgba(198,166,100,0.1); box-shadow: 0 5px 20px rgba(0,0,0,0.03); transition: all 0.3s ease;" onmouseover="this.style.boxShadow='0 10px 30px rgba(0,0,0,0.08)'; this.style.transform='translateY(-3px)';" onmouseout="this.style.boxShadow='0 5px 20px rgba(0,0,0,0.03)'; this.style.transform='translateY(0)';">
                            ${isLeft ? `
                                <div style="border-radius: 15px; overflow: hidden; aspect-ratio: 1; background: #f9f9f9; box-shadow: 0 8px 25px rgba(0,0,0,0.1); position: relative;">
                                    <img src="${section.image}" alt="Description ${index + 1}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;" onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">
                                    <div style="position: absolute; top: 15px; left: 15px; background: rgba(198,166,100,0.9); color: white; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 1px; backdrop-filter: blur(10px);">FEATURE ${index + 1}</div>
                                </div>
                                <div style="font-size: 15px; line-height: 1.9; color: var(--text); padding: 20px; font-weight: 300; white-space: pre-line;">${section.text}</div>
                            ` : `
                                <div style="font-size: 15px; line-height: 1.9; color: var(--text); padding: 20px; font-weight: 300; white-space: pre-line;">${section.text}</div>
                                <div style="border-radius: 15px; overflow: hidden; aspect-ratio: 1; background: #f9f9f9; box-shadow: 0 8px 25px rgba(0,0,0,0.1); position: relative;">
                                    <img src="${section.image}" alt="Description ${index + 1}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;" onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">
                                    <div style="position: absolute; top: 15px; left: 15px; background: rgba(198,166,100,0.9); color: white; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 1px; backdrop-filter: blur(10px);">FEATURE ${index + 1}</div>
                                </div>
                            `}
                        </div>
                    `;
                }).join('');
            } else {
                console.log('No description sections found');
            }
            
            document.title = `${product.name} - MF Production`;
        }

        function getCategoryName(category) {
            const categoryNames = {
                'electronics': 'Electronics',
                'men': "Men's Fashion",
                'women': "Women's Fashion",
                'perfumes': 'Perfumes'
            };
            return categoryNames[category] || category;
        }

        function generateStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;
            let stars = '';
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star"></i>';
            }
            
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            }
            
            const emptyStars = 5 - Math.ceil(rating);
            for (let i = 0; i < emptyStars; i++) {
                stars += '<i class="far fa-star"></i>';
            }
            
            return stars;
        }

        function setupImageGallery(product) {
            const thumbnailGallery = document.getElementById('thumbnailGallery');
            const mainImage = document.getElementById('productImage');
            
            // Create array of all product images
            const allImages = [product.image];
            if (product.images && product.images.length > 0) {
                allImages.push(...product.images);
            }
            
            // Remove duplicates
            const uniqueImages = [...new Set(allImages)];
            
            if (uniqueImages.length > 1) {
                thumbnailGallery.innerHTML = uniqueImages.map((img, index) => `
                    <div class="thumbnail ${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">
                        <img src="${img}" alt="Product image ${index + 1}" onerror="this.parentElement.style.display='none'">
                    </div>
                `).join('');
            } else {
                thumbnailGallery.style.display = 'none';
            }
        }
        
        function changeMainImage(imageSrc, thumbnailElement) {
            const mainImage = document.getElementById('productImage');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            // Update main image
            mainImage.src = imageSrc;
            
            // Update active thumbnail
            thumbnails.forEach(thumb => thumb.classList.remove('active'));
            thumbnailElement.classList.add('active');
        }

        function changeQuantity(change) {
            const qtyInput = document.getElementById('quantity');
            const newQty = Math.max(1, parseInt(qtyInput.value) + change);
            qtyInput.value = newQty;
            quantity = newQty;
        }

        function addToCart() {
            if (!currentProduct) return;
            
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            let found = cart.find(item => item.id === currentProduct._id);
            
            if (found) {
                found.quantity += quantity;
            } else {
                cart.push({
                    id: currentProduct._id,
                    name: currentProduct.name,
                    price: currentProduct.price,
                    image: currentProduct.image,
                    quantity: quantity
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Update cart count if function exists
            if (typeof updateCartCount === 'function') {
                updateCartCount();
            }
            
            // Show success message
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Added to Cart';
            btn.style.background = '#6b9b6e';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = 'var(--dark)';
            }, 2000);
        }

        function buyNow() {
            if (!currentProduct) return;
            
            const buyNowItem = {
                id: currentProduct._id,
                name: currentProduct.name,
                price: currentProduct.price,
                image: currentProduct.image,
                quantity: quantity
            };
            
            sessionStorage.setItem('buyNowItem', JSON.stringify(buyNowItem));
            window.location.href = 'checkout.html?buynow=true';
        }

        function addToWishlist() {
            if (!currentProduct) return;
            
            let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            let found = wishlist.find(item => item.id === currentProduct._id);
            
            const btn = document.querySelector('.btn-wishlist');
            
            if (found) {
                btn.innerHTML = '<i class="fas fa-heart" style="color: #ff6b35;"></i>';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-heart"></i>';
                }, 1000);
            } else {
                wishlist.push(currentProduct);
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                btn.innerHTML = '<i class="fas fa-heart" style="color: #ff6b35;"></i>';
            }
        }

        function shareProduct() {
            if (navigator.share) {
                navigator.share({
                    title: currentProduct.name,
                    text: currentProduct.description,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                const btn = document.querySelector('.btn-share');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1000);
            }
        }

        async function loadRelatedProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                const related = products.filter(p => p.category === currentProduct.category && p._id !== currentProduct._id).slice(0, 4);
                
                const container = document.getElementById('relatedProducts');
                container.innerHTML = related.map(product => `
                    <div onclick="window.location.href='product-view.html?id=${product._id}'" style="cursor: pointer; background: var(--white); border-radius: 20px; overflow: hidden; transition: all 0.4s ease; border: 1px solid #f0f0f0; position: relative;" onmouseover="this.style.transform='translateY(-8px)'; this.style.boxShadow='0 15px 40px rgba(0,0,0,0.1)'; this.style.borderColor='#e0e0e0'; this.querySelector('.bottom-bar').style.transform='scaleX(1)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'; this.style.borderColor='#f0f0f0'; this.querySelector('.bottom-bar').style.transform='scaleX(0)';">
                        <div style="aspect-ratio: 1; overflow: hidden; background: #f9f9f9; position: relative;">
                            <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;" onmouseover="this.style.transform='scale(1.1)';" onmouseout="this.style.transform='scale(1)';">
                            <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.3)); opacity: 0; transition: opacity 0.3s;" class="img-overlay"></div>
                        </div>
                        <div style="padding: 25px;">
                            <h4 style="margin-bottom: 10px; font-size: 16px; font-weight: 400; color: var(--dark); line-height: 1.4; min-height: 44px;">${product.name}</h4>
                            <div style="color: var(--gold); font-size: 14px; letter-spacing: 1px; margin-bottom: 12px;">★★★★★</div>
                            <div style="color: var(--dark); font-size: 20px; font-weight: 300; letter-spacing: -0.5px;">AED ${product.price.toLocaleString()}</div>
                        </div>
                        <div class="bottom-bar" style="position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), #D4AF37); transform: scaleX(0); transition: transform 0.3s ease;"></div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading related products:', error);
            }
        }

        // Reviews functionality
        let selectedRating = 0;
        let productReviews = [];

        // Star rating interaction
        function initializeStarRating() {
            const stars = document.querySelectorAll('.star-rating span');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    selectedRating = parseInt(this.dataset.rating);
                    updateStarDisplay();
                });
                star.addEventListener('mouseover', function() {
                    const rating = parseInt(this.dataset.rating);
                    highlightStars(rating);
                });
            });
            
            document.querySelector('.star-rating').addEventListener('mouseleave', function() {
                updateStarDisplay();
            });
        }

        function highlightStars(rating) {
            const stars = document.querySelectorAll('.star-rating span');
            stars.forEach((star, index) => {
                star.style.color = index < rating ? 'var(--gold)' : '#e0e0e0';
            });
        }

        function updateStarDisplay() {
            highlightStars(selectedRating);
        }

        // Load product reviews
        async function loadProductReviews() {
            if (!currentProduct) return;
            
            try {
                const response = await fetch(`/api/reviews/product/${currentProduct._id}`);
                if (response.ok) {
                    productReviews = await response.json();
                    displayReviews();
                }
            } catch (error) {
                console.error('Error loading reviews:', error);
            }
        }

        function displayReviews() {
            const container = document.getElementById('reviewsContainer');
            if (!container) return;
            
            if (productReviews.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 60px 20px; font-size: 15px; font-weight: 300;">No reviews yet. Be the first to share your thoughts.</p>';
                return;
            }
            
            container.innerHTML = productReviews.map(review => `
                <div style="background: var(--white); padding: 35px; border-radius: 20px; border: 1px solid #f0f0f0; transition: all 0.3s; position: relative; overflow: hidden;" onmouseover="this.style.borderColor='#e0e0e0'; this.style.boxShadow='0 5px 20px rgba(0,0,0,0.05)'; this.style.transform='translateY(-2px)';" onmouseout="this.style.borderColor='#f0f0f0'; this.style.boxShadow='none'; this.style.transform='translateY(0)';">
                    <div style="position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: linear-gradient(180deg, var(--gold), #D4AF37);"></div>
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
                        <div>
                            <h4 style="margin: 0 0 10px 0; color: var(--dark); font-size: 16px; font-weight: 500;">${review.customerName}</h4>
                            <div style="color: var(--gold); font-size: 16px; letter-spacing: 2px;">${'\u2605'.repeat(review.rating)}${'\u2606'.repeat(5 - review.rating)}</div>
                        </div>
                        <small style="color: #999; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">${new Date(review.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</small>
                    </div>
                    <p style="color: var(--text); line-height: 1.8; margin: 0; font-size: 14px; font-weight: 300;">${review.comment}</p>
                </div>
            `).join('');
        }

        // Submit review
        function initializeReviewForm() {
            const reviewForm = document.getElementById('reviewForm');
            if (reviewForm) {
                reviewForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    if (!currentProduct) {
                        alert('Product not loaded');
                        return;
                    }
                    
                    const name = document.getElementById('reviewerName').value;
                    const comment = document.getElementById('reviewComment').value;
                    
                    if (!selectedRating) {
                        alert('Please select a rating');
                        return;
                    }
                    
                    const reviewData = {
                        customerName: name,
                        productId: currentProduct._id,
                        rating: selectedRating,
                        comment: comment
                    };
                    
                    try {
                        const response = await fetch('/api/reviews', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(reviewData)
                        });
                        
                        if (response.ok) {
                            alert('Review submitted successfully! It will appear after approval.');
                            reviewForm.reset();
                            selectedRating = 0;
                            updateStarDisplay();
                            loadProductReviews();
                        } else {
                            alert('Error submitting review');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Error submitting review');
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadProduct().then(() => {
                loadProductReviews();
                initializeStarRating();
                initializeReviewForm();
            });
        });
    </script>
</body>
</html>
