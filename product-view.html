<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - MF Production</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/improved-cards.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #C6A664;
            --primary-dark: #B8985A;
            --accent-orange: #ff6b35;
            --success-green: #28a745;
            --text-dark: #2c3e50;
            --text-light: #6c757d;
            --bg-light: #f8f9fa;
            --shadow-light: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-medium: 0 8px 30px rgba(0,0,0,0.12);
            --shadow-heavy: 0 20px 60px rgba(0,0,0,0.15);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            box-sizing: border-box;
        }
        .breadcrumb {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px 0;
            border-bottom: 1px solid rgba(198, 166, 100, 0.1);
            position: relative;
            overflow: hidden;
        }
        .breadcrumb::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .breadcrumb-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }
        .breadcrumb-nav a {
            color: #C6A664;
            text-decoration: none;
        }
        .breadcrumb-nav a:hover {
            text-decoration: underline;
        }
        
        .product-detail {
            padding: 60px 0;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            min-height: 100vh;
        }
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Image Gallery */
        .product-gallery {
            position: sticky;
            top: 20px;
        }
        .main-image {
            width: 100%;
            height: 650px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-heavy);
            margin-bottom: 25px;
            position: relative;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            cursor: zoom-in;
            border: 3px solid rgba(198, 166, 100, 0.1);
        }
        .main-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(198, 166, 100, 0.1) 0%, transparent 50%, rgba(198, 166, 100, 0.05) 100%);
            opacity: 0;
            transition: var(--transition);
            z-index: 1;
        }
        .main-image:hover::before {
            opacity: 1;
        }
        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
            filter: brightness(1) contrast(1.05);
        }
        .main-image:hover img {
            transform: scale(1.08);
            filter: brightness(1.05) contrast(1.1);
        }
        .image-badges {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .badge {
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            animation: bounceIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }
        .badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }
        .badge:hover::before {
            left: 100%;
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
            50% { opacity: 1; transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .badge-new {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        .badge-sale {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }
        .badge-bestseller {
            background: linear-gradient(135deg, #C6A664, #D4AF37);
            color: white;
            box-shadow: 0 4px 15px rgba(198, 166, 100, 0.3);
        }
        
        .thumbnail-gallery {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
        }
        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .thumbnail.active {
            border-color: #C6A664;
            transform: scale(1.1);
        }
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Product Info */
        .product-info {
            padding: 30px 0;
            animation: fadeInRight 0.8s ease-out 0.2s both;
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .product-category {
            display: inline-block;
            background: rgba(198, 166, 100, 0.1);
            color: #C6A664;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .product-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--text-dark);
            line-height: 1.1;
            letter-spacing: -0.5px;
            animation: slideInUp 0.8s ease-out 0.6s both;
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .product-rating {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .stars {
            color: #ffc107;
            font-size: 18px;
        }
        .rating-text {
            font-weight: 600;
            color: #333;
        }
        .review-count {
            color: #666;
        }
        
        .product-price {
            margin-bottom: 30px;
        }
        .price-container {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 10px;
        }
        .current-price {
            font-size: 32px;
            font-weight: 700;
            color: #C6A664;
        }
        .original-price {
            font-size: 24px;
            color: #999;
            text-decoration: line-through;
        }
        .discount-badge {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }
        .price-note {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .product-description {
            font-size: 16px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 35px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 4px solid #C6A664;
        }
        
        /* Quantity & Actions */
        .quantity-section {
            margin-bottom: 30px;
        }
        .quantity-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .quantity-input {
            display: flex;
            align-items: center;
            border: 2px solid #eee;
            border-radius: 10px;
            overflow: hidden;
        }
        .qty-btn {
            width: 45px;
            height: 45px;
            border: none;
            background: #f8f9fa;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .qty-btn:hover {
            background: #C6A664;
            color: white;
        }
        .qty-value {
            width: 60px;
            height: 45px;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
        }
        .stock-info {
            font-size: 14px;
            color: #28a745;
            font-weight: 600;
        }
        
        .product-actions {
            display: flex !important;
            gap: 15px;
            margin-bottom: 40px;
            visibility: visible !important;
        }
        .btn-add-cart, .btn-buy-now {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .btn-add-cart {
            flex: 1;
            padding: 20px 35px;
            background: linear-gradient(135deg, #C6A664, #D4AF37);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(198, 166, 100, 0.3);
        }
        .btn-buy-now {
            flex: 1;
            padding: 20px 35px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }
        .btn-add-cart::before, .btn-buy-now::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }
        .btn-add-cart:hover::before, .btn-buy-now:hover::before {
            left: 100%;
        }
        .btn-add-cart:hover, .btn-buy-now:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .btn-add-cart:hover {
            box-shadow: 0 15px 40px rgba(198, 166, 100, 0.4);
        }
        .btn-buy-now:hover {
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
        }
        .btn-add-cart:active, .btn-buy-now:active {
            transform: translateY(-2px) scale(0.98);
        }
        .btn-wishlist, .btn-share {
            padding: 20px;
            background: rgba(198, 166, 100, 0.05);
            border: 2px solid #C6A664;
            color: #C6A664;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(198, 166, 100, 0.1);
        }
        .btn-wishlist:hover, .btn-share:hover {
            background: #C6A664;
            color: white;
            transform: translateY(-2px);
        }
        

        

        
        /* Related Products */
        .related-products {
            margin-top: 80px;
            padding: 80px 0;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f8f9fa 100%);
            position: relative;
        }
        .related-products::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #C6A664, transparent);
        }
        .related-title {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 60px;
            color: #333;
            position: relative;
            letter-spacing: -0.5px;
        }
        .related-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #C6A664, #D4AF37);
            border-radius: 2px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .product-gallery {
                position: static;
            }
            .main-image {
                height: 400px;
            }
            .product-title {
                font-size: 28px;
            }
            .current-price {
                font-size: 28px;
            }
            .product-features {
                grid-template-columns: 1fr;
            }
            .product-actions {
                flex-direction: column;
                gap: 15px;
            }
            .btn-add-cart, .btn-buy-now {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <!-- Breadcrumb -->
    <section class="breadcrumb">
        <div class="container">
            <nav class="breadcrumb-nav">
                <a href="index.html">Home</a>
                <i class="fas fa-chevron-right"></i>
                <a href="products.html">Products</a>
                <i class="fas fa-chevron-right"></i>
                <span id="breadcrumbCategory">Category</span>
                <i class="fas fa-chevron-right"></i>
                <span id="breadcrumbProduct">Product</span>
            </nav>
        </div>
    </section>

    <!-- Product Detail -->
    <section class="product-detail">
        <div class="product-detail-container">
            <!-- Product Gallery -->
            <div class="product-gallery">
                <div class="main-image">
                    <img id="productImage" src="" alt="Product Image">
                    <div class="image-badges" id="productBadges"></div>
                </div>
                <div class="thumbnail-gallery" id="thumbnailGallery"></div>
            </div>
            
            <!-- Product Info -->
            <div class="product-info">
                <div class="product-category" id="productCategory"></div>
                <h1 class="product-title" id="productTitle">Loading...</h1>
                
                <div class="product-rating">
                    <div class="stars" id="productStars"></div>
                    <span class="rating-text" id="productRating">0</span>
                    <span class="review-count">(<span id="productReviews">0</span> reviews)</span>
                </div>
                
                <div class="product-price">
                    <div class="price-container">
                        <span class="current-price" id="productPrice">Rs. 0</span>
                        <span class="original-price" id="productOriginalPrice" style="display: none;"></span>
                        <span class="discount-badge" id="discountBadge" style="display: none;"></span>
                    </div>
                    <div class="price-note">Inclusive of all taxes • Free shipping on orders over AED 540</div>
                </div>
                
                <div class="product-description" id="productDescription">Loading product details...</div>
                
                <div class="quantity-section">
                    <div class="quantity-label">Quantity:</div>
                    <div class="quantity-controls">
                        <div class="quantity-input">
                            <button class="qty-btn" onclick="changeQuantity(-1)">-</button>
                            <input type="number" class="qty-value" id="quantity" value="1" min="1" readonly>
                            <button class="qty-btn" onclick="changeQuantity(1)">+</button>
                        </div>
                        <div class="stock-info">
                            <i class="fas fa-check-circle"></i>
                            <span id="productStock">0</span> in stock
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; gap: 15px; margin-bottom: 40px;">
                    <button onclick="addToCart()" style="flex: 1; padding: 20px 35px; background: linear-gradient(135deg, #C6A664, #D4AF37); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 8px 25px rgba(198, 166, 100, 0.3); transition: all 0.4s ease;">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Add to Cart</span>
                    </button>
                    <button onclick="buyNow()" style="flex: 1; padding: 20px 35px; background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3); transition: all 0.4s ease;">
                        <i class="fas fa-bolt"></i>
                        <span>Buy Now</span>
                    </button>
                    <button onclick="addToWishlist()" title="Add to Wishlist" style="padding: 20px; background: rgba(198, 166, 100, 0.05); border: 2px solid #C6A664; color: #C6A664; border-radius: 15px; cursor: pointer; font-size: 20px; transition: all 0.4s ease;">
                        <i class="fas fa-heart"></i>
                    </button>
                    <button onclick="shareProduct()" title="Share Product" style="padding: 20px; background: rgba(198, 166, 100, 0.05); border: 2px solid #C6A664; color: #C6A664; border-radius: 15px; cursor: pointer; font-size: 20px; transition: all 0.4s ease;">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Reviews Section -->
        <div class="container" style="margin-top: 60px;">
            <div style="background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <h3 style="font-size: 28px; font-weight: 700; color: #2c3e50; margin-bottom: 30px; display: flex; align-items: center; gap: 12px;"><i class="fas fa-comments" style="color: #C6A664;"></i> Customer Reviews</h3>
                
                <!-- Write Review Form -->
                <div style="background: #f8f9fa; padding: 30px; border-radius: 15px; margin-bottom: 40px; border: 2px solid rgba(198, 166, 100, 0.1);">
                    <h4 style="margin-bottom: 20px; color: #2c3e50; display: flex; align-items: center; gap: 10px;"><i class="fas fa-edit"></i> Write a Review</h4>
                    <form id="reviewForm">
                        <div style="display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px;">
                            <input type="text" id="reviewerName" placeholder="Your Name" required style="padding: 12px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 14px; transition: border-color 0.3s;" onfocus="this.style.borderColor='#C6A664'" onblur="this.style.borderColor='#e9ecef'">
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50;">Rating:</label>
                            <div class="star-rating" style="font-size: 28px; color: #ddd; cursor: pointer; display: flex; gap: 5px;">
                                <span data-rating="1" style="transition: all 0.2s; transform-origin: center;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">★</span>
                                <span data-rating="2" style="transition: all 0.2s; transform-origin: center;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">★</span>
                                <span data-rating="3" style="transition: all 0.2s; transform-origin: center;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">★</span>
                                <span data-rating="4" style="transition: all 0.2s; transform-origin: center;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">★</span>
                                <span data-rating="5" style="transition: all 0.2s; transform-origin: center;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">★</span>
                            </div>
                        </div>
                        <textarea id="reviewComment" placeholder="Write your review..." required style="width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 14px; min-height: 100px; resize: vertical; transition: border-color 0.3s;" onfocus="this.style.borderColor='#C6A664'" onblur="this.style.borderColor='#e9ecef'"></textarea>
                        <button type="submit" style="background: linear-gradient(135deg, #C6A664, #D4AF37); color: white; padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: all 0.3s; box-shadow: 0 3px 10px rgba(198, 166, 100, 0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 5px 15px rgba(198, 166, 100, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 3px 10px rgba(198, 166, 100, 0.3)'"><i class="fas fa-paper-plane"></i> Submit Review</button>
                    </form>
                </div>
                
                <!-- Reviews Display -->
                <div id="reviewsContainer" style="display: grid; gap: 20px;">
                    <!-- Reviews loaded via JS -->
                </div>
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section class="related-products">
        <div class="container">
            <h2 class="related-title">You May Also Like</h2>
            <div class="related-grid" id="relatedProducts"></div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    
    <script>
        let currentProduct = null;
        let quantity = 1;

        async function loadProduct() {
            return new Promise(async (resolve, reject) => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
                if (!productId) {
                    window.location.href = 'products.html';
                    reject('No product ID');
                    return;
                }

                try {
                    const response = await fetch(`/api/products/${productId}`);
                    if (response.ok) {
                        currentProduct = await response.json();
                        displayProduct(currentProduct);
                        loadRelatedProducts();
                        resolve(currentProduct);
                    } else {
                        throw new Error('Product not found');
                    }
                } catch (error) {
                    console.error('Error loading product:', error);
                    document.querySelector('.product-detail-container').innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff6b35; margin-bottom: 20px;"></i>
                            <h2>Product Not Found</h2>
                            <p>The product you're looking for doesn't exist or has been removed.</p>
                            <button class="btn btn-primary" onclick="window.location.href='products.html'" style="padding: 15px 30px; background: #C6A664; color: white; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer;">
                                <i class="fas fa-arrow-left"></i> Back to Products
                            </button>
                        </div>
                    `;
                    reject(error);
                }
            });
        }

        function displayProduct(product) {
            // Update breadcrumb
            document.getElementById('breadcrumbCategory').textContent = getCategoryName(product.category);
            document.getElementById('breadcrumbProduct').textContent = product.name;
            
            // Product images
            document.getElementById('productImage').src = product.image;
            document.getElementById('productImage').alt = product.name;
            
            // Setup image gallery
            setupImageGallery(product);
            
            // Product badges
            const badges = [];
            if (product.new) badges.push('<span class="badge badge-new">New</span>');
            if (product.originalPrice) badges.push('<span class="badge badge-sale">Sale</span>');
            if (product.bestseller) badges.push('<span class="badge badge-bestseller">Bestseller</span>');
            document.getElementById('productBadges').innerHTML = badges.join('');
            
            // Product info
            document.getElementById('productCategory').textContent = getCategoryName(product.category);
            document.getElementById('productTitle').textContent = product.name;
            document.getElementById('productStars').innerHTML = generateStars(product.rating || 4.5);
            document.getElementById('productRating').textContent = (product.rating || 4.5).toFixed(1);
            document.getElementById('productReviews').textContent = product.reviews || 0;
            document.getElementById('productPrice').textContent = `AED ${product.price.toLocaleString()}`;
            
            if (product.originalPrice) {
                document.getElementById('productOriginalPrice').textContent = `AED ${product.originalPrice.toLocaleString()}`;
                document.getElementById('productOriginalPrice').style.display = 'inline';
                
                const discount = Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100);
                document.getElementById('discountBadge').textContent = `${discount}% OFF`;
                document.getElementById('discountBadge').style.display = 'inline-block';
            }
            
            document.getElementById('productDescription').textContent = product.description;
            document.getElementById('productStock').textContent = product.stock || 10;
            
            document.title = `${product.name} - MF Production`;
        }

        function getCategoryName(category) {
            const categoryNames = {
                'electronics': 'Electronics',
                'men': "Men's Fashion",
                'women': "Women's Fashion",
                'perfumes': 'Perfumes'
            };
            return categoryNames[category] || category;
        }

        function generateStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;
            let stars = '';
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star"></i>';
            }
            
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            }
            
            const emptyStars = 5 - Math.ceil(rating);
            for (let i = 0; i < emptyStars; i++) {
                stars += '<i class="far fa-star"></i>';
            }
            
            return stars;
        }

        function setupImageGallery(product) {
            const thumbnailGallery = document.getElementById('thumbnailGallery');
            const mainImage = document.getElementById('productImage');
            
            // Create array of all product images
            const allImages = [product.image];
            if (product.images && product.images.length > 0) {
                allImages.push(...product.images);
            }
            
            // Remove duplicates
            const uniqueImages = [...new Set(allImages)];
            
            if (uniqueImages.length > 1) {
                thumbnailGallery.innerHTML = uniqueImages.map((img, index) => `
                    <div class="thumbnail ${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">
                        <img src="${img}" alt="Product image ${index + 1}" onerror="this.parentElement.style.display='none'">
                    </div>
                `).join('');
            } else {
                thumbnailGallery.style.display = 'none';
            }
        }
        
        function changeMainImage(imageSrc, thumbnailElement) {
            const mainImage = document.getElementById('productImage');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            // Update main image
            mainImage.src = imageSrc;
            
            // Update active thumbnail
            thumbnails.forEach(thumb => thumb.classList.remove('active'));
            thumbnailElement.classList.add('active');
        }

        function changeQuantity(change) {
            const qtyInput = document.getElementById('quantity');
            const newQty = Math.max(1, parseInt(qtyInput.value) + change);
            qtyInput.value = newQty;
            quantity = newQty;
        }

        function addToCart() {
            if (!currentProduct) return;
            
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            let found = cart.find(item => item.id === currentProduct._id);
            
            if (found) {
                found.quantity += quantity;
            } else {
                cart.push({
                    id: currentProduct._id,
                    name: currentProduct.name,
                    price: currentProduct.price,
                    image: currentProduct.image,
                    quantity: quantity
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Show success message
            const btn = document.querySelector('.btn-add-cart');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Added to Cart!';
            btn.style.background = '#28a745';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = 'linear-gradient(135deg, #C6A664, #D4AF37)';
            }, 2000);
        }

        function buyNow() {
            if (!currentProduct) return;
            
            const buyNowItem = {
                id: currentProduct._id,
                name: currentProduct.name,
                price: currentProduct.price,
                image: currentProduct.image,
                quantity: quantity
            };
            
            sessionStorage.setItem('buyNowItem', JSON.stringify(buyNowItem));
            window.location.href = 'checkout.html?buynow=true';
        }

        function addToWishlist() {
            if (!currentProduct) return;
            
            let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            let found = wishlist.find(item => item.id === currentProduct._id);
            
            const btn = document.querySelector('.btn-wishlist');
            
            if (found) {
                btn.innerHTML = '<i class="fas fa-heart" style="color: #ff6b35;"></i>';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-heart"></i>';
                }, 1000);
            } else {
                wishlist.push(currentProduct);
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                btn.innerHTML = '<i class="fas fa-heart" style="color: #ff6b35;"></i>';
            }
        }

        function shareProduct() {
            if (navigator.share) {
                navigator.share({
                    title: currentProduct.name,
                    text: currentProduct.description,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                const btn = document.querySelector('.btn-share');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1000);
            }
        }

        async function loadRelatedProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                const related = products.filter(p => p.category === currentProduct.category && p._id !== currentProduct._id).slice(0, 4);
                
                const container = document.getElementById('relatedProducts');
                container.innerHTML = related.map(product => `
                    <div class="product-card" onclick="window.location.href='product-view.html?id=${product._id}'" style="cursor: pointer; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(198, 166, 100, 0.1); position: relative;" onmouseover="this.style.transform='translateY(-10px) scale(1.02)'; this.style.boxShadow='0 25px 60px rgba(198, 166, 100, 0.2)';" onmouseout="this.style.transform='translateY(0) scale(1)'; this.style.boxShadow='0 15px 40px rgba(0,0,0,0.1)';">
                        <div style="height: 220px; overflow: hidden; position: relative;">
                            <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease;" onmouseover="this.style.transform='scale(1.1)';" onmouseout="this.style.transform='scale(1)';">
                            <div style="position: absolute; top: 15px; right: 15px; background: rgba(198, 166, 100, 0.9); color: white; padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: 600; backdrop-filter: blur(10px);">NEW</div>
                        </div>
                        <div style="padding: 25px;">
                            <h4 style="margin-bottom: 12px; font-size: 18px; font-weight: 700; color: #333; line-height: 1.3;">${product.name}</h4>
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
                                <div style="color: #ffc107; font-size: 14px;">★★★★★</div>
                                <span style="color: #666; font-size: 14px;">(4.5)</span>
                            </div>
                            <div style="color: #C6A664; font-size: 20px; font-weight: 800;">AED ${product.price.toLocaleString()}</div>
                        </div>
                        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #C6A664, #D4AF37); transform: scaleX(0); transition: transform 0.3s ease; transform-origin: left;"></div>
                    </div>
                `).join('');
                
                // Add hover effect for the bottom border
                setTimeout(() => {
                    document.querySelectorAll('.product-card').forEach(card => {
                        card.addEventListener('mouseenter', function() {
                            const border = this.querySelector('div:last-child');
                            if (border) border.style.transform = 'scaleX(1)';
                        });
                        card.addEventListener('mouseleave', function() {
                            const border = this.querySelector('div:last-child');
                            if (border) border.style.transform = 'scaleX(0)';
                        });
                    });
                }, 100);
            } catch (error) {
                console.error('Error loading related products:', error);
            }
        }

        // Reviews functionality
        let selectedRating = 0;
        let productReviews = [];

        // Star rating interaction
        function initializeStarRating() {
            const stars = document.querySelectorAll('.star-rating span');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    selectedRating = parseInt(this.dataset.rating);
                    updateStarDisplay();
                });
                star.addEventListener('mouseover', function() {
                    const rating = parseInt(this.dataset.rating);
                    highlightStars(rating);
                });
            });
            
            document.querySelector('.star-rating').addEventListener('mouseleave', function() {
                updateStarDisplay();
            });
        }

        function highlightStars(rating) {
            const stars = document.querySelectorAll('.star-rating span');
            stars.forEach((star, index) => {
                star.style.color = index < rating ? '#C6A664' : '#ddd';
            });
        }

        function updateStarDisplay() {
            highlightStars(selectedRating);
        }

        // Load product reviews
        async function loadProductReviews() {
            if (!currentProduct) return;
            
            try {
                const response = await fetch(`/api/reviews/product/${currentProduct._id}`);
                if (response.ok) {
                    productReviews = await response.json();
                    displayReviews();
                }
            } catch (error) {
                console.error('Error loading reviews:', error);
            }
        }

        function displayReviews() {
            const container = document.getElementById('reviewsContainer');
            if (!container) return;
            
            if (productReviews.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 40px; background: #f8f9fa; border-radius: 12px;">No reviews yet. Be the first to write a review!</p>';
                return;
            }
            
            container.innerHTML = productReviews.map(review => `
                <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 3px 15px rgba(0,0,0,0.08); transition: all 0.3s; border-left: 4px solid #C6A664;" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 8px 25px rgba(0,0,0,0.12)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 3px 15px rgba(0,0,0,0.08)'">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                        <div>
                            <h4 style="margin: 0 0 8px 0; color: #2c3e50; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px;"><i class="fas fa-user-circle" style="color: #C6A664;"></i>${review.customerName}</h4>
                            <div style="color: #C6A664; font-size: 18px; margin-bottom: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.1);">${'\u2605'.repeat(review.rating)}${'\u2606'.repeat(5 - review.rating)}</div>
                        </div>
                        <small style="color: #6c757d; background: #f8f9fa; padding: 6px 10px; border-radius: 8px; font-weight: 500;"><i class="fas fa-calendar-alt" style="margin-right: 4px;"></i>${new Date(review.createdAt).toLocaleDateString()}</small>
                    </div>
                    <p style="color: #495057; line-height: 1.7; margin: 0; font-size: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 3px solid #C6A664;">${review.comment}</p>
                </div>
            `).join('');
        }

        // Submit review
        function initializeReviewForm() {
            const reviewForm = document.getElementById('reviewForm');
            if (reviewForm) {
                reviewForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    if (!currentProduct) {
                        alert('Product not loaded');
                        return;
                    }
                    
                    const name = document.getElementById('reviewerName').value;
                    const comment = document.getElementById('reviewComment').value;
                    
                    if (!selectedRating) {
                        alert('Please select a rating');
                        return;
                    }
                    
                    const reviewData = {
                        customerName: name,
                        productId: currentProduct._id,
                        rating: selectedRating,
                        comment: comment
                    };
                    
                    try {
                        const response = await fetch('/api/reviews', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(reviewData)
                        });
                        
                        if (response.ok) {
                            alert('Review submitted successfully! It will appear after approval.');
                            reviewForm.reset();
                            selectedRating = 0;
                            updateStarDisplay();
                            loadProductReviews();
                        } else {
                            alert('Error submitting review');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Error submitting review');
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadProduct().then(() => {
                loadProductReviews();
                initializeStarRating();
                initializeReviewForm();
            });
        });
    </script>
</body>
</html>
